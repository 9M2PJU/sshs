[package]
name = "sshs"
version = "4.8.1"
edition = "2021"
description = "Terminal user interface for SSH"
license = "MIT"
authors = ["Nathanael Demacon"]

[[bin]]
name = "sshs"
path = "src/main.rs"

[[example]]
name = "demo"
path = "scripts/demo.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1

[package.metadata.deb]
maintainer = "9M2PJU <9m2pju@gmail.com>"
copyright = "2026, 9M2PJU, Nathanael Demacon"
license-file = ["LICENSE", "4"]
extended-description = "Terminal user interface for SSH with themes, ASCII banners, SSHS Explorer, and networking hub."
depends = "$auto, openssh-client"
section = "net"
priority = "optional"

[package.metadata.generate-rpm]
assets = [
    { source = "sshs", dest = "/usr/bin/sshs", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/sshs/README.md", mode = "644", doc = true },
    { source = "docs/user-manual.md", dest = "/usr/share/doc/sshs/user-manual.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/sshs/LICENSE", mode = "644", doc = true },
]

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.37", features = ["derive", "env"] }
crossterm = "0.29.0"
fuzzy-matcher = "0.3.7"
glob = "0.3.2"
handlebars = "6.3.2"
itertools = "0.14.0"
ratatui = "0.30.0"
regex = { version = "1.11.1", default-features = false, features = ["std"] }
serde = { version = "1.0.219", features = ["derive"] }
shellexpand = "3.1.1"
shlex = "1.3.0"
strum = "0.28.0"
strum_macros = "0.28.0"
toml = "0.8"
tui-input = "0.15.0"
unicode-width = "0.2.2"

[dev-dependencies]
